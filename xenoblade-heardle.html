    button{ padding:10px 16px; cursor:pointer; background:var(--accent); border:none; border-radius:10px; color:#000; font-weight:700 }

    button:disabled{ background:#666; color:#222; cursor:not-allowed }
    progress{ width:220px; height:12px }
    #progresses{ margin:16px 0; display:flex; flex-direction:column; align-items:center; gap:10px }
    .progress-row{ display:flex; align-items:center; gap:10px }
    #result{ font-weight:700; margin:14px 0; font-size:18px; min-height:24px }
    #player{ display:none; margin:14px auto; width:100%; max-width:560px; height:315px }
    #guess-section{ display:none }
    #diag{ font-family:ui-monospace,Consolas,monospace; white-space:pre-wrap; opacity:.8; font-size:12px; margin-top:8px; text-align:left; max-height:160px; overflow:auto; background:#0d0d0d; border:1px solid #222; padding:8px; border-radius:8px }
    .small{ font-size:12px; opacity:.9 }
    @media (max-width:680px){ #container{ padding:14px } button{ padding:10px 14px; font-size:14px } progress{ width:170px } #player{ height:200px } }

<body>
  <div id="container">
    <h1>Xenoblade Heardle</h1>
    <p>Guess the song. The video appears—and audio plays—only after you finish guessing.</p>

    <div class="row" id="gate-row">
      <button id="start">Tap to Start</button>
      <button id="audioTest" class="small" title="If you have no audio, tap this first">Enable Audio</button>
    </div>

    <div id="guess-section" aria-live="polite">
      <div id="player" allow="autoplay; encrypted-media; fullscreen; picture-in-picture"></div>
      <input id="guessInput" type="text" list="songs" placeholder="Type the song title…" autocomplete="off" />
      <datalist id="songs"></datalist>
      <div class="row">
        <button id="guessBtn">Guess</button>
        <button id="skipBtn">Skip</button>
        <button id="playBtn">Play Current Clip</button>
      </div>
      <div id="progresses">
        <div class="progress-row">
          <label>Guesses:</label>
          <progress id="guessProgress" value="0" max="6"></progress>
          <span id="guessLabel">0/6</span>
        </div>
        <div class="progress-row">
          <label>Clip Length:</label>
          <progress id="clipProgress" value="1" max="16"></progress>
          <span id="clipLabel">1s / 16s</span>
        </div>
      </div>
      <div id="result"></div>
      <div id="diag" aria-hidden="true"></div>
    </div>
  </div>

<script>
  /* ==================== HELPERS ==================== */
  const $ = sel => document.querySelector(sel);
  function log(msg){ const d=$('#diag'); if(!d) return; d.textContent=(d.textContent+' '+msg).trim().slice(-2000); d.scrollTop=d.scrollHeight; }
  const sleep = ms => new Promise(r=>setTimeout(r,ms));

  /* ==================== CONFIG ==================== */
  const STORAGE_KEY = 'xeno-heardle-custom-config-v1';
  const safeJSONParse = (value, fallback) => {
    if (!value) return fallback;
    try { return JSON.parse(value); } catch { return fallback; }
  };

  const normalizeBackgrounds = (arr=[]) => arr
    .filter(item => typeof item === 'string')
    .map(item => item.trim())
    .filter(Boolean);

  const normalizeSongs = (arr=[]) => {
    const result=[];
    for (const raw of Array.isArray(arr)?arr:[]){
      if(!raw) continue;
      const title = (raw.title ?? '').toString().trim();
      const game = (raw.game ?? '').toString().trim();
      const videoId = (raw.videoId ?? '').toString().trim();
      if(!title) continue;
      result.push({ title, game: game || 'Unknown', videoId });
    }
    return result;
  };

  const dedupeBackgrounds = (arr=[]) => {
    const seen=new Set();
    const out=[];
    for (const url of Array.isArray(arr)?arr:[]){
      if(!url) continue;
      const key=url.toLowerCase();
      if(seen.has(key)) continue;
      seen.add(key);
      out.push(url);
    }
    return out;
  };

  const dedupeSongs = (arr=[]) => {
    const seen=new Set();
    const out=[];
    for (const song of Array.isArray(arr)?arr:[]){
      if(!song || !song.title) continue;
      const key=song.title.toLowerCase();
      if(seen.has(key)) continue;
      seen.add(key);
      out.push(song);
    }
    return out;
  };

  const baseConfig = (()=>{
    const node=document.getElementById('heardle-config');
    const parsed = safeJSONParse(node?node.textContent:null, { backgrounds:[], songs:[] });
    return {
      backgrounds: dedupeBackgrounds(normalizeBackgrounds(parsed.backgrounds)),
      songs: dedupeSongs(normalizeSongs(parsed.songs))
    };
  })();

  const storageAvailable = (()=>{
    try{
      const key='__heardle_storage__';
      window.localStorage.setItem(key,'1');
      window.localStorage.removeItem(key);
      return true;
    }catch{
      return false;
    }
  })();

  const storedCustom = storageAvailable ? safeJSONParse(window.localStorage.getItem(STORAGE_KEY), { backgrounds:[], songs:[] }) : { backgrounds:[], songs:[] };

  const customConfig = {
    backgrounds: dedupeBackgrounds(normalizeBackgrounds(storedCustom.backgrounds)),
    songs: dedupeSongs(normalizeSongs(storedCustom.songs))
  };

  const warnIfNoStorage = (()=>{
    let warned=false;
    return ()=>{
      if (storageAvailable || warned) return;
      warned=true;
      log('Storage is unavailable; custom entries reset after reload.');
    };
  })();

  let backgrounds = dedupeBackgrounds([...(baseConfig.backgrounds||[]), ...(customConfig.backgrounds||[])]);
  let songs = dedupeSongs([...(baseConfig.songs||[]), ...(customConfig.songs||[])]);

  const DURATIONS = [1,2,4,7,11,16]; // seconds

  function persistCustomConfig(){
    if(!storageAvailable) return false;
    try{
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(customConfig));
      return true;
    }catch(e){
      log('Saving custom config failed: '+e.message);
      return false;
    }
  }

  function refreshRuntimeConfig(){
    backgrounds = dedupeBackgrounds([...(baseConfig.backgrounds||[]), ...(customConfig.backgrounds||[])]);
    songs = dedupeSongs([...(baseConfig.songs||[]), ...(customConfig.songs||[])]);
    populateDatalist();
    setDailyBackground();
  }

  /* ==================== STATE ==================== */
  let player, isReady=false, audioUnlocked=false, gameOver=false, clipTimer=null;
  const failedIds=new Set();
  let attempt=0; // 0..5
  let currentSong=null;

  /* ==================== UTILS ==================== */
  function dailyIndex(mod){
    if(!mod) return 0;
    const day=Math.floor(Date.now()/86400000);
    return ((day%mod)+mod)%mod;
  }

  async function loadBackgroundSafe(urls, timeoutMs=3500){

    const expand = (rawUrl)=>{
      const seen=[];
      const pushUnique=(val)=>{ if(val && !seen.includes(val)) seen.push(val); };
      const strictEncode=(value)=>{
        if(!value) return '';
        let decoded=value.trim();
        if(!decoded) return '';
        try{ decoded = decodeURI(decoded); }catch{}
        const encoded=encodeURIComponent(decoded);
        return encoded.replace(/[!'()*]/g,c=>`%${c.charCodeAt(0).toString(16).toUpperCase()}`);
      };
      let normalized=rawUrl;
      try{ normalized=new URL(rawUrl, window.location.href).href; }catch{}
      pushUnique(normalized);
      const encodedFull=strictEncode(normalized);
      if(encodedFull){
        pushUnique(`https://images.weserv.nl/?url=${encodedFull}&w=1600&h=900&fit=cover&we&output=webp`);
        pushUnique(`https://wsrv.nl/?url=${encodedFull}&w=1600&h=900&fit=cover&we&output=webp`);
      }
      const bare=normalized.replace(/^https?:\/\//,'');
      if(bare!==normalized){
        const encodedBare=strictEncode(bare);
        if(encodedBare){
          pushUnique(`https://images.weserv.nl/?url=${encodedBare}&w=1600&h=900&fit=cover&we&output=webp`);
          pushUnique(`https://wsrv.nl/?url=${encodedBare}&w=1600&h=900&fit=cover&we&output=webp`);
        }
      }
      return seen;
    };
    const candidates = urls.flatMap(expand);
    for (const url of candidates){
      try{
        await new Promise((res,rej)=>{ const im=new Image(); const to=setTimeout(()=>{im.src=''; rej(new Error('bg timeout'));},timeoutMs); im.onload=()=>{clearTimeout(to); res();}; im.onerror=()=>{clearTimeout(to); rej(new Error('bg error'));}; im.referrerPolicy='no-referrer'; im.crossOrigin='anonymous'; im.src=url; });
        document.body.style.backgroundImage=`url(${url})`;
        log('BG loaded: '+url); return true;
      }catch(e){ log('BG failed: '+url+' ('+e.message+')'); }
    }
    document.body.style.backgroundImage='radial-gradient(1200px 600px at 50% -10%, rgba(255,215,0,.12), rgba(0,0,0,0) 60%), linear-gradient(#0e0e0e,#1a1a1a)';
    return false;
  }

  function populateDatalist(){ const dl=$('#songs'); if(!dl) return; dl.innerHTML=''; const seen=new Set(); for(const s of songs){ if(!s.title||seen.has(s.title)) continue; seen.add(s.title); const o=document.createElement('option'); o.value=s.title; if(s.game) o.label=s.game; dl.appendChild(o);} }

  function pickSong(){
    if (!songs.length) return null;
    let idx = dailyIndex(songs.length);
    for (let i=0;i<songs.length;i++){
      const s = songs[(idx+i)%songs.length];
      if (!s.videoId) continue; if (failedIds.has(s.videoId)) continue; return s;
    } return null;
  }

  function updateProgress(){ $('#guessProgress').value=attempt; $('#guessLabel').textContent=`${attempt}/6`; const clip=DURATIONS[Math.min(attempt, DURATIONS.length-1)]; $('#clipProgress').value=clip; $('#clipLabel').textContent=`${clip}s / 16s`; }
  function disableInputs(b){ $('#guessInput').disabled=b; $('#guessBtn').disabled=b; $('#skipBtn').disabled=b; $('#playBtn').disabled=b; }

  function endGame(){ gameOver=true; clearTimeout(clipTimer); $('#player').style.display='block'; try{ player.setSize(560,315); player.loadVideoById(currentSong.videoId,0); }catch{} disableInputs(true); log('Game ended; full video shown.'); }

  /* ==================== AUDIO UNLOCK (WebAudio) ==================== */
  let ctx=null;
  async function unlockAudioOnce(){
    if (audioUnlocked) return; try{
      const AudioContext = window.AudioContext || window.webkitAudioContext; if (!AudioContext) { audioUnlocked=true; return; }
      ctx = ctx || new AudioContext();
      if (ctx.state === 'suspended') { await ctx.resume(); }
      const osc = ctx.createOscillator(); const gain = ctx.createGain(); gain.gain.value=0.0001; osc.connect(gain).connect(ctx.destination); osc.start(); await sleep(120); osc.stop();
      audioUnlocked = true; log('Audio unlocked via WebAudio');
    }catch(e){ log('Audio unlock failed: '+e.message); }
  }

  let pendingGestureUnlock=null;
  function installGestureUnlock(){
    if (!player || typeof player.playVideo !== 'function') return;
    if (pendingGestureUnlock) return;

    const opts = { passive:true };
    const handler = ()=>{
      document.removeEventListener('pointerdown', handler, opts);
      document.removeEventListener('touchstart', handler, opts);
      pendingGestureUnlock = null;
      try{
        player.mute();
        player.playVideo();
        player.pauseVideo();
        player.unMute();
        log('Player unlocked via gesture');
      }catch(e){
        log('Gesture unlock failed: '+e.message);
      }
    };

    pendingGestureUnlock = handler;
    document.addEventListener('pointerdown', handler, opts);
    document.addEventListener('touchstart', handler, opts);
  }

  /* ==================== YT API LOADER ==================== */
  let ytReadyPromise=null; let ytReadyResolve=null;
  function injectYT(){
    if (document.querySelector('script[src*="youtube.com/iframe_api"]')) return;
    const s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api'; s.async=true; document.head.appendChild(s);
  }
  function waitForYT(){
    if (window.YT && typeof YT.Player==='function') return Promise.resolve();
    if (!ytReadyPromise){ ytReadyPromise = new Promise(res=>{ ytReadyResolve = res; }); }
    return ytReadyPromise;
  }
  window.onYouTubeIframeAPIReady = function(){ log('YT API ready'); if (ytReadyResolve) ytReadyResolve(); };

  async function createPlayer(){
    await waitForYT();
    return new Promise(resolve=>{
      const vars = { autoplay:0, controls:0, disablekb:1, fs:0, rel:0, playsinline:1, modestbranding:1 };
      // Do not set origin—YouTube handles it; avoids mismatches in some hosts.
      player = new YT.Player('player',{
        height:'315', width:'560',
        playerVars: vars,
        events:{
          onReady: ()=>{ isReady=true; try{ player.setVolume(100); }catch{} log('YT ready'); resolve(); },
          onStateChange: (e)=>{ if (e.data===YT.PlayerState.ENDED && !gameOver){ try{ player.pauseVideo(); }catch{} } if (e.data===YT.PlayerState.CUED){ log('YT state: CUED'); } },
          onError: (e)=>{ const id=currentSong&&currentSong.videoId; if(id) failedIds.add(id); $('#result').textContent=`Error loading song: ${currentSong?currentSong.title:'(unknown)'} — skipping…`; $('#result').style.color='red'; log('YT error '+e.data+' for '+id); startNewSong(); }
        }
      });
    });
  }

  /* ==================== GAME FLOW ==================== */
  async function setDailyBackground(){
    if (!backgrounds.length){
      document.body.style.backgroundImage='radial-gradient(1200px 600px at 50% -10%, rgba(255,215,0,.12), rgba(0,0,0,0) 60%), linear-gradient(#0e0e0e,#1a1a1a)';
      return;
    }
    const startIdx=dailyIndex(backgrounds.length);
    const ordered=[];
    for(let i=0;i<backgrounds.length;i++){
      ordered.push(backgrounds[(startIdx+i)%backgrounds.length]);
    }
    await loadBackgroundSafe(ordered);
  }

  async function startRound(){
    $('#gate-row').style.display='none'; $('#guess-section').style.display='block';
    setDailyBackground();
    populateDatalist();
    await startNewSong(true);
  }

  async function startNewSong(first=false){
    gameOver=false; attempt=0; updateProgress(); disableInputs(false); $('#result').textContent=''; $('#result').style.color='';
    currentSong = pickSong(); if (!currentSong){ $('#result').textContent='No playable songs available.'; $('#result').style.color='red'; disableInputs(true); return; }

    $('#player').style.display='none'; try{ player.setSize(0,0); }catch{}
    try{ player.cueVideoById(currentSong.videoId); }catch(e){ log('cue error: '+e.message); failedIds.add(currentSong.videoId); return startNewSong(); }

    // Wait for CUED (or timeout) then try a muted nudge, then play clip.
    await Promise.race([ new Promise(r=>{ const t=setInterval(()=>{ try{ if(player.getPlayerState()===YT.PlayerState.CUED){ clearInterval(t); r(); } }catch{} },50); }), sleep(1500) ]);

    if(first) await primePlayerForAutoplay();
    playClip();
  }

  async function primePlayerForAutoplay(options={}){
    const silent=!!options.silent;
    if (!player || typeof player.playVideo!=='function'){
      if(!silent) log('Player not ready to prime yet.');
      return;
    }
    try{
      player.mute();
      player.seekTo(0,true);
      player.playVideo();
      await sleep(180);
      player.pauseVideo();
      player.unMute();
      if(!silent) log('Player primed for autoplay');
    }catch(e){
      if(!silent) log('Autoplay prime failed: '+e.message);
    }
  }

  function playClip(){
    if (gameOver || !currentSong) return; clearTimeout(clipTimer);
    const sec=DURATIONS[Math.min(attempt, DURATIONS.length-1)];
    try{ player.unMute(); player.seekTo(0,true); player.playVideo(); }catch{}
    log('Playing clip '+sec+'s');
    clipTimer=setTimeout(()=>{ if(!gameOver){ try{ player.pauseVideo(); }catch{} log('Clip paused'); } }, sec*1000);
    setTimeout(()=>{ (async()=>{
      if (gameOver || !player || !window.YT) return;
      try{
        const state=player.getPlayerState();
        if(state!==YT.PlayerState.PLAYING){
          log('Autoplay blocked; retrying prime…');
          await primePlayerForAutoplay({ silent:true });
          try{ player.playVideo(); }catch{}
        }
      }catch(e){ log('Playback check failed: '+e.message); }
    })(); }, 420);
  }

  function submitGuess(){
    if (gameOver || !currentSong) return; const val=$('#guessInput').value.trim().toLowerCase(); $('#guessInput').value='';
    if (val === currentSong.title.toLowerCase()){
      $('#result').textContent = `Correct! It's "${currentSong.title}" from ${currentSong.game}.`; $('#result').style.color='lime'; endGame();
    }else{
      attempt++;
      updateProgress();
      if (attempt < 6) {
        playClip();
      } else {
        $('#result').textContent=`Game over. It was "${currentSong.title}" from ${currentSong.game}.`;
        $('#result').style.color='red';
        endGame();
      }
    }
  }

  function skip(){
    if (gameOver) return;
    attempt++;
    updateProgress();
    if (attempt < 6){
      playClip();
    }else{
      $('#result').textContent=`Game over. It was "${currentSong.title}" from ${currentSong.game}.`;
      $('#result').style.color='red';
      endGame();
    }
  }

  /* ==================== CUSTOM DATA HELPERS ==================== */
  const HeardleAdmin = {
    addSong(song){
      const normalized = normalizeSongs([song])[0];
      if(!normalized) throw new Error('Song must include at least a title.');
      customConfig.songs = dedupeSongs([...(customConfig.songs||[]), normalized]);
      refreshRuntimeConfig();
      if(!persistCustomConfig()) warnIfNoStorage();
      log(`Custom song added: ${normalized.title}`);
      if(!normalized.videoId){ log('Note: this song has no videoId yet, so it will be skipped until added.'); }
      return normalized;
    },
    addBackground(url){
      const normalized = normalizeBackgrounds([url])[0];
      if(!normalized) throw new Error('Background URL is required.');
      customConfig.backgrounds = dedupeBackgrounds([...(customConfig.backgrounds||[]), normalized]);
      refreshRuntimeConfig();
      if(!persistCustomConfig()) warnIfNoStorage();
      log(`Custom background added: ${normalized}`);
      return normalized;
    },
    listSongs(){ return songs.slice(); },
    listBackgrounds(){ return backgrounds.slice(); },
    exportCustom(){ return JSON.stringify(customConfig, null, 2); },
    importCustom(data){
      const parsed = typeof data==='string' ? safeJSONParse(data, null) : data;
      if(!parsed) throw new Error('Invalid custom data payload.');
      customConfig.songs = dedupeSongs(normalizeSongs(parsed.songs));
      customConfig.backgrounds = dedupeBackgrounds(normalizeBackgrounds(parsed.backgrounds));
      refreshRuntimeConfig();
      if(!persistCustomConfig()) warnIfNoStorage();
      log('Custom config imported.');
      return { ...customConfig };
    },
    resetCustom(){
      customConfig.songs = [];
      customConfig.backgrounds = [];
      refreshRuntimeConfig();
      if(!persistCustomConfig()) warnIfNoStorage();
      log('Custom config cleared.');
    },
    getCombinedConfig(){
      return { backgrounds: backgrounds.slice(), songs: songs.slice() };
    }
  };
  window.HeardleAdmin = HeardleAdmin;

  if (storageAvailable){
    window.addEventListener('storage', (event)=>{
      if(event.key!==STORAGE_KEY) return;
      const next = safeJSONParse(event.newValue, { backgrounds:[], songs:[] });
      customConfig.songs = dedupeSongs(normalizeSongs(next.songs));
      customConfig.backgrounds = dedupeBackgrounds(normalizeBackgrounds(next.backgrounds));
      refreshRuntimeConfig();
      log('Custom config reloaded from another tab.');
    });
  }

  refreshRuntimeConfig();
  log(`Loaded ${songs.length} songs (${customConfig.songs.length} custom).`);
  if(customConfig.backgrounds.length){ log(`Loaded ${customConfig.backgrounds.length} custom backgrounds.`); }
  log('Tip: open the browser console and use window.HeardleAdmin to manage custom songs and backgrounds.');

  window.HeardleGame = {
    start: startRound,
    restart: ()=>startNewSong(false),
    newSong: startNewSong,
    get songs(){ return songs.slice(); },
    get backgrounds(){ return backgrounds.slice(); },
    primePlayer: primePlayerForAutoplay,
    get custom(){ return { ...customConfig }; }
  };

  /* ==================== WIRE UP ==================== */
  window.addEventListener('pageshow',()=>{ setDailyBackground(); });
  document.addEventListener('visibilitychange',()=>{ if(document.hidden){ clearTimeout(clipTimer); } });

  $('#start').addEventListener('click', async ()=>{
    log('Start tapped');
    await unlockAudioOnce();
    injectYT();
    try{ await createPlayer(); }catch(e){ log('player create failed: '+e.message); }
    if (!isReady){ log('Waiting for YT…'); for(let i=0;i<20 && !isReady;i++){ await sleep(150);} }
    if (!isReady){ $('#result').textContent='YouTube failed to initialize. Check CSP or connection.'; $('#result').style.color='red'; return; }
    installGestureUnlock();
    await primePlayerForAutoplay({ silent:true });
    await startRound();
  });

  $('#audioTest').addEventListener('click', async ()=>{ await unlockAudioOnce(); installGestureUnlock(); });
  $('#playBtn').addEventListener('click', ()=> playClip());
  $('#guessBtn').addEventListener('click', ()=> submitGuess());
  $('#skipBtn').addEventListener('click', ()=> skip());
  $('#guessInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') submitGuess(); });
</script>
</body>
</html>
